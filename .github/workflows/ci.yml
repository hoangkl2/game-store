name: validation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.4-bookworm
        env:
          POSTGRES_DB: game_store
          POSTGRES_USER: game_store
          POSTGRES_PASSWORD: ci_database_credential
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U game_store -d game_store"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7.4.1-bookworm
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      NODE_ENV: test
      PORT: 4000
      INSTANCE_ID: api-ci-1
      DATABASE_URL: postgresql://game_store:ci_database_credential@127.0.0.1:5432/game_store?schema=public
      DATABASE_REQUIRED: "true"
      REDIS_URL: redis://127.0.0.1:6379
      REDIS_REQUIRED: "true"
      REDIS_KEY_PREFIX: gs:test:v1:
      ACCESS_TOKEN_SECRET: ci-access-token-secret-at-least-32-bytes
      ACCESS_TOKEN_ISSUER: game-store-api-ci
      ACCESS_TOKEN_AUDIENCE: game-store-web-ci
      ACCESS_TOKEN_TTL_SECONDS: 600
      REFRESH_TOKEN_TTL_SECONDS: 86400
      STATE_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
      COOKIE_SECURE: "false"
      COOKIE_SAME_SITE: lax
      CORS_ORIGINS: http://localhost:3000
      CSRF_COOKIE_NAME: gs_csrf
      REFRESH_COOKIE_NAME: gs_refresh
      MAX_HTTP_BODY_BYTES: 16384
      MAX_SOCKET_PAYLOAD_BYTES: 8192
      TRUST_PROXY: "false"
      RUN_INTEGRATION: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9.15.0 }
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.5
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @game-store/api prisma:validate
      - run: pnpm --filter @game-store/api prisma:generate
      - run: pnpm --filter @game-store/api prisma:migrate
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm --filter @game-store/api test:e2e
      - run: pnpm build
      - run: pnpm exec playwright test
      - run: pnpm audit --prod --audit-level high
      - run: pnpm security:secrets

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f apps/api/Dockerfile -t game-store-api:${{ github.sha }} .

  production-flow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9.15.0 }
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.5
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: docker compose config --quiet
      - run: docker compose up --detach --build postgres redis migrate api-1 api-2 gateway
      - name: Validate restart, failover, and backup restore
        run: RUN_PRODUCTION_FLOW=true pnpm --filter @game-store/api test:production-flow
      - name: Run isolated load smoke
        run: LOAD_BASE_URL=http://127.0.0.1:4000 LOAD_DURATION_SECONDS=10 pnpm --filter @game-store/api load:smoke
      - if: always()
        run: docker compose down --volumes
